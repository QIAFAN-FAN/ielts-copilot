name: 💡 提个建议
description: 想要新功能，或者觉得哪里可以更好用
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。请说明**你想解决的问题**，而不只是一个功能名字 —— 这样更容易找到更好的做法。

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新功能
        - 现有功能可以更好用
        - 翻译/分析质量
        - 界面/交互
        - 省 API 花费
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么情况
      description: 描述一下具体场景，比如"做听力 Section 3 时……"
      placeholder: 我在做题时经常需要……，现在得手动……
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么做
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 你现在是怎么绕过去的
      description: 可选。有临时办法说明这个需求真实存在

  - type: checkboxes
    id: scope
    attributes:
      label: 补充
      options:
        - label: 这个建议不依赖 DeepSeek 之外的额外服务
          required: false
        - label: 我愿意自己动手实现并提 PR
          required: false
